<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc">
<title id="title">RaceTime Replay architecture overview</title><desc id="desc">Exported video and watch data enter local OpenCV measurements and validated parsers, then offset alignment produces candidate events. A bounded LangGraph investigator retrieves and verifies evidence. Streamlit serves synchronized browser replay and human review. Optional Gemini or Nebius receives redacted text only; optional Braintrust exports restricted metadata for synthetic demos only. Files are local and graph checkpoints are in memory.</desc>
<rect width="1440" height="1260" rx="24" fill="#f5f3eb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6a8790"/></marker></defs>
<text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#187b70">RACETIME REPLAY  /  IMPLEMENTED PYTHON WORKFLOW</text>
<text x="40" y="101" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#203646">From separate recordings to shared evidence</text>
<text x="40" y="143" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526976">Core analysis runs on the app host. The bundled demo works without an API key.</text>
