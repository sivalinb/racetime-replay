<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
<title id="title">RaceTime Replay at a glance</title><desc id="desc">Runners import video and workout exports, align both on one video clock, then review candidate stops and sensor disagreements. The screens and values are illustrative, not actual workout results.</desc>
<rect width="1440" height="700" rx="24" fill="#f5f3eb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6a8790"/></marker></defs>
<text x="40" y="48" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#187b70">RACETIME REPLAY  /  THE PRODUCT</text>
<text x="40" y="104" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#203646">See the run behind the numbers.</text>
<text x="40" y="145" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#526976">For runners, coaches and crews who want to revisit what happened along the way.</text>
<rect x="40" y="185" width="400" height="390" rx="18" fill="#ffffff" stroke="none"/>
<rect x="520" y="185" width="400" height="390" rx="18" fill="#ffffff" stroke="none"/>
<rect x="1000" y="185" width="400" height="390" rx="18" fill="#ffffff" stroke="none"/>
<path d="M458 375 H500" stroke="#6a8790" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M938 375 H980" stroke="#6a8790" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="80" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="73" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">1</text>
<text x="112" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Capture the run</text>
<circle cx="560" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="553" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">2</text>
<text x="592" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Align the evidence</text>
<circle cx="1040" cy="222" r="18" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="1033" y="230" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">3</text>
<text x="1072" y="230" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Review the moment</text>
<rect x="70" y="262" width="340" height="190" rx="12" fill="#dceaf0" stroke="none"/>
<circle cx="113" cy="299" r="16" fill="#efc879" stroke="none" stroke-width="2"/>
<path d="M75 410 L151 309 L214 375 L283 288 L405 419 Z" stroke="none" stroke-width="0" fill="#83afa9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 432 L154 356 L209 411 L301 346 L405 432 Z" stroke="none" stroke-width="0" fill="#386c72" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M128 438 C262 433 188 398 296 365" stroke="#f7df9b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="321" y="296" width="40" height="156" rx="12" fill="#becbd2" stroke="none"/>
<rect x="300" y="326" width="84" height="101" rx="20" fill="#203646" stroke="none"/>
<rect x="308" y="336" width="68" height="80" rx="14" fill="#ffffff" stroke="none"/>
<path d="M315 380 H328 L335 363 L344 394 L352 373 H369" stroke="#187b70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="490" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#203646">Camera + workout export</text>
<text x="70" y="524" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#526976">GoPro · Insta360 · iPhone</text>
<text x="70" y="553" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#526976">Meta glasses + watch data</text>
<rect x="550" y="262" width="340" height="190" rx="12" fill="#eaf0f5" stroke="none"/>
<text x="568" y="297" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#396f9a">ONE VIDEO CLOCK</text>
<rect x="729" y="310" width="30" height="105" rx="4" fill="#d7e7df" stroke="none"/>
<text x="568" y="334" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#526976">Speed</text>
<path d="M636 328 H672 L690 322 L707 331 H729 L738 352 H751 L763 328 H870" stroke="#396f9a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="568" y="390" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#526976">Heart rate</text>
<path d="M665 385 L686 379 L707 383 L728 374 L749 377 L770 369 L791 375 L812 367 L833 370 H870" stroke="#187b70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M568 428 H870" stroke="#bdcbd0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="744" cy="428" r="9" fill="#a66b27" stroke="none" stroke-width="2"/>
<text x="550" y="490" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#203646">Replay both in sync</text>
<text x="550" y="524" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Set the offset. Keep gaps visible.</text>
<text x="550" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#526976">Compare signals at each moment.</text>
<rect x="1030" y="262" width="340" height="190" rx="12" fill="#e6f1ea" stroke="none"/>
<rect x="1047" y="279" width="305" height="68" rx="8" fill="#ffffff" stroke="none"/>
<circle cx="1065" cy="301" r="6" fill="#187b70" stroke="none" stroke-width="2"/>
<text x="1081" y="307" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#187b70">Stop candidate</text>
<text x="1060" y="332" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#526976">Open the timestamped frame</text>
<rect x="1047" y="359" width="305" height="68" rx="8" fill="#ffffff" stroke="none"/>
<circle cx="1065" cy="381" r="6" fill="#a66b27" stroke="none" stroke-width="2"/>
<text x="1081" y="387" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#a66b27">Sensor disagreement</text>
<text x="1060" y="412" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#526976">Compare video and watch</text>
<text x="1030" y="490" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#203646">Watch. Inspect. Decide.</text>
<text x="1030" y="524" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Review events and cited answers.</text>
<text x="1030" y="553" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#526976">Confirm or reject after replay.</text>
<text x="40" y="624" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#187b70">Video + watch data → moments worth reviewing</text>
<text x="40" y="666" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Illustrative screens. Camera motion is not running speed. Event candidates need human review.</text>
</svg>