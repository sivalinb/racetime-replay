<text x="553" y="232" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">2</text>
<text x="592" y="232" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#203646">Local measurements</text>
