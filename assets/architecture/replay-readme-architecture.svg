<text x="544" y="354" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Speed · heart rate · route</text>
<text x="544" y="384" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#526976">Keep missing values explicit</text>
